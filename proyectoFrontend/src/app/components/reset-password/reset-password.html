<div class="sesion-page-wrapper">
    <main class="flex-grow-1 py-4 py-md-5">
        <div class="container sesion-wrap">
            <h1 class="h3 fw-bold text-center mb-4 sesion-page-title">Nueva Contraseña</h1>

            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card border-0 h-100 rounded-4 shadow-sm sesion-card">
                        <div class="card-header py-3 fw-semibold border-0 rounded-top-4">
                            Establecer nueva contraseña
                        </div>
                        <div class="card-body p-4">
                            <p class="text-muted small mb-4" *ngIf="!mensaje">
                                Escribe tu nueva contraseña a continuación.
                            </p>

                            <div *ngIf="nombre && !mensaje" class="alert alert-secondary py-2 small fw-semibold text-center mb-4">
                                <i class="bi bi-person-badge me-2"></i>Cambiando contraseña de: <span class="text-home-accent">{{nombre}}</span>
                            </div>

                            <form (ngSubmit)="onReset()" #resetForm="ngForm" *ngIf="!mensaje">
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="reset-password" name="password" 
                                           [(ngModel)]="password" placeholder="Nueva contraseña" required minlength="4">
                                    <label for="reset-password">Nueva contraseña</label>
                                </div>

                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="reset-confirm" name="confirmPassword" 
                                           [(ngModel)]="confirmPassword" placeholder="Repetir contraseña" required>
                                    <label for="reset-confirm">Repetir contraseña</label>
                                </div>

                                <button type="submit" class="btn btn-home w-100" [disabled]="!resetForm.valid || enviando || !token">
                                    {{ enviando ? 'Actualizando...' : 'Cambiar contraseña' }}
                                </button>
                                
                                <div *ngIf="error" class="alert alert-danger mt-3 small animate-fade-in">
                                    {{ error }}
                                </div>
                            </form>

                            <div *ngIf="mensaje" class="alert alert-success mt-3 small animate-fade-in text-center">
                                <i class="bi bi-check-circle-fill fs-4 d-block mb-2"></i>
                                {{ mensaje }}
                                <div class="mt-3"> Redirigiendo al login... </div>
                            </div>

                            <div class="text-center mt-4 pt-2 border-top">
                                <a routerLink="/login" class="text-home-accent text-decoration-none small fw-bold">
                                    Volver al inicio de sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
