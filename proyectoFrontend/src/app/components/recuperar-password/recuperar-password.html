<div class="sesion-page-wrapper">
    <main class="flex-grow-1 py-4 py-md-5">
        <div class="container sesion-wrap">
            <h1 class="h3 fw-bold text-center mb-4 sesion-page-title">Recuperar Contraseña</h1>

            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card border-0 h-100 rounded-4 shadow-sm sesion-card">
                        <div class="card-header py-3 fw-semibold border-0 rounded-top-4">
                            Solicitar enlace de recuperación
                        </div>
                        <div class="card-body p-4">
                            <p class="text-muted small mb-4">
                                Introduce tu correo electrónico y te enviaremos un enlace para que puedas restablecer tu
                                contraseña.
                            </p>

                            <form (ngSubmit)="onRecuperar()" #recuperarForm="ngForm">
                                <!-- Nombre de Usuario -->
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="recuperar-nombre" name="nombre"
                                        [(ngModel)]="nombre" placeholder="Tu nombre de usuario" required>
                                    <label for="recuperar-nombre">Nombre de usuario</label>
                                </div>

                                <!-- Correo Electrónico -->
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="recuperar-email" name="email"
                                        [(ngModel)]="email" placeholder="nombre@ejemplo.com" required email>
                                    <label for="recuperar-email">Correo electrónico</label>
                                </div>

                                <button type="submit" class="btn btn-home w-100"
                                    [disabled]="!recuperarForm.valid || enviando">
                                    {{ enviando ? 'Enviando...' : 'Enviar enlace' }}
                                </button>

                                <div *ngIf="mensaje" class="alert alert-success mt-3 small animate-fade-in">
                                    {{ mensaje }}
                                </div>

                                <div *ngIf="error" class="alert alert-danger mt-3 small animate-fade-in">
                                    {{ error }}
                                </div>

                                <div class="text-center mt-4 pt-2 border-top">
                                    <a routerLink="/login" class="text-home-accent text-decoration-none small fw-bold">
                                        <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
