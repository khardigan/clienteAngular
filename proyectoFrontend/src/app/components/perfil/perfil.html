<div class="container mt-3" *ngIf="mensajeSuccess">
  <div class="alert alert-success alert-dismissible fade show shadow-sm border-0" role="alert">
    <i class="bi bi-check-circle-fill me-2"></i> {{ mensajeSuccess }}
  </div>
</div>
<div class="container mt-3" *ngIf="mensajeError">
  <div class="alert alert-danger alert-dismissible fade show shadow-sm border-0" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ mensajeError }}
  </div>
</div>

<!-- Titulo y icono de perfil de boostrap-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<h1 class="text-center size-2 my-4">Perfil <i class="bi bi-person-circle"></i></h1>

<section class="section about-section gray-bg main-content-wrapper" id="about">
  <div class="container" *ngIf="perfil">
    <div class="row align-items-center flex-row-reverse">
      <div class="col-lg-6">
        <div class="about-text go-to">
          <label class="small text-muted mb-1">Nombre Público</label>
          <input type="text" class="form-control form-control-lg dark-color fw-bold border-0 bg-transparent p-0 mb-2"
            [(ngModel)]="perfil.nombrePerfil" placeholder="Tu nombre público...">

          <label class="small text-muted mb-1">Subtítulo / Profesión</label>
          <input type="text" class="form-control theme-color lead border-0 bg-transparent p-0 mb-3"
            [(ngModel)]="perfil.subtitulo" placeholder="Ej: Diseñador de UX/UI...">

          <label class="small text-muted mb-1">Sobre mí</label>
          <textarea class="form-control border-0 bg-white shadow-sm rounded-3 p-3 mb-4" rows="4"
            [(ngModel)]="perfil.descripcion" placeholder="Cuéntanos algo sobre ti..."></textarea>

          <div class="row about-list">
            <div class="col-md-6">
              <div class="media">
                <label>Cumpleaños</label>
                <input type="date" class="form-control form-control-sm border-0 bg-transparent"
                  [(ngModel)]="perfil.fechaNacimiento">
              </div>
              <div class="media">
                <label>Edad</label>
                <div class="d-flex align-items-center">
                  <input type="number" class="form-control form-control-sm border-0 bg-transparent w-25"
                    [(ngModel)]="perfil.edad" placeholder="0">
                  <span class="small text-muted ms-1">Años</span>
                </div>
              </div>
              <div class="media">
                <label>Residencia</label>
                <input type="text" class="form-control form-control-sm border-0 bg-transparent"
                  [(ngModel)]="perfil.residencia" placeholder="Madrid, España">
              </div>
            </div>
            <div class="col-md-6">
              <div class="media">
                <label>E-mail</label>
                <p class="form-control-sm border-0 bg-transparent mb-0 text-muted"
                  style="cursor: not-allowed; user-select: all;" title="El correo no es editable">
                  <i class="bi bi-lock-fill me-1 text-secondary" style="font-size: 0.75rem;"></i>{{ perfil.email }}
                </p>
              </div>
              <div class="media">
                <label>Teléfono</label>
                <input type="text" class="form-control form-control-sm border-0 bg-transparent"
                  [(ngModel)]="perfil.telefono" placeholder="600 000 000">
              </div>
            </div>
          </div>

          <div class="mt-4 pt-2">
            <button class="btn btn-primary rounded-pill px-4 py-2 shadow-sm fw-bold" (click)="guardarCambios()">
              <i class="bi bi-save me-2"></i> Guardar Cambios
            </button>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="about-avatar text-center">
          <div class="position-relative d-inline-block">
            <img [src]="perfil.imagenUrl || 'https://bootdey.com/img/Content/avatar/avatar7.png'" 
                 class="rounded-circle shadow-lg mb-3" alt="Avatar"
                 style="width: 250px; height: 250px; object-fit: cover; border: 5px solid white;">
            
            <div class="mt-2">
              <label class="small text-muted mb-1 d-block">URL de tu foto de perfil</label>
              <input type="text" class="form-control form-control-sm rounded-pill shadow-sm" 
                     [(ngModel)]="perfil.imagenUrl" placeholder="Pega aquí el enlace a tu imagen...">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sección de estadísticas clickables -->
  <div class="container">
    <div class="counter mt-5">
      <div class="row g-3">
        <!-- Listas Creadas → va a /mis-listas -->
        <div class="col-6 col-lg-3">
          <a routerLink="/mis-listas" class="text-decoration-none">
            <div class="count-data text-center p-3 rounded-4 shadow-sm bg-white border border-light"
              style="cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;"
              onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 8px 25px rgba(0,0,0,0.1)'"
              onmouseout="this.style.transform=''; this.style.boxShadow=''">
              <i class="bi bi-journal-text fs-3 text-primary mb-2 d-block"></i>
              <h6 class="count h2 text-dark">{{ totalListas() }}</h6>
              <p class="m-0px font-w-600 text-muted small">Listas Creadas</p>
            </div>
          </a>
        </div>

        <!-- Productos Añadidos → va a /productos -->
        <div class="col-6 col-lg-3">
          <a routerLink="/productos" class="text-decoration-none">
            <div class="count-data text-center p-3 rounded-4 shadow-sm bg-white border border-light"
              style="cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;"
              onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 8px 25px rgba(0,0,0,0.1)'"
              onmouseout="this.style.transform=''; this.style.boxShadow=''">
              <i class="bi bi-box-seam fs-3 text-success mb-2 d-block"></i>
              <h6 class="count h2 text-dark">{{ totalProductos() }}</h6>
              <p class="m-0px font-w-600 text-muted small">Productos Añadidos</p>
            </div>
          </a>
        </div>

        <!-- Colaboraciones → va a /mis-listas -->
        <div class="col-6 col-lg-3">
          <a routerLink="/mis-listas" class="text-decoration-none">
            <div class="count-data text-center p-3 rounded-4 shadow-sm bg-white border border-light"
              style="cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;"
              onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 8px 25px rgba(0,0,0,0.1)'"
              onmouseout="this.style.transform=''; this.style.boxShadow=''">
              <i class="bi bi-people fs-3 text-warning mb-2 d-block"></i>
              <h6 class="count h2 text-dark">{{ totalColaboraciones() }}</h6>
              <p class="m-0px font-w-600 text-muted small">Colaboraciones</p>
            </div>
          </a>
        </div>

        <!-- Listas Públicas → va a /comunidad -->
        <div class="col-6 col-lg-3">
          <a routerLink="/comunidad" class="text-decoration-none">
            <div class="count-data text-center p-3 rounded-4 shadow-sm bg-white border border-light"
              style="cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;"
              onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 8px 25px rgba(0,0,0,0.1)'"
              onmouseout="this.style.transform=''; this.style.boxShadow=''">
              <i class="bi bi-globe fs-3 text-info mb-2 d-block"></i>
              <h6 class="count h2 text-dark">{{ totalPublicas() }}</h6>
              <p class="m-0px font-w-600 text-muted small">Listas en Comunidad</p>
            </div>
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
